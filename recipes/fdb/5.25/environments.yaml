fdb:
  compiler: [gcc]
  unify: when_possible
  packages: []
  specs:
  - fdb@=5.25.0 backends=lustre
  - gribjump@=0.13.1
  - eckit@=2.5.0 linalg=none compression=lz4 +curl +ssl +proj +python
  - metkit@=1.22.0
  - eccodes@=2.50.0 jp2k=none ~fortran +pthreads +aec +geo
  - ecbuild@=3.13.1
  - python@=3.11.15
  - mir@=1.30.2 +python
  - ecmwf-atlas@=0.47.0 +tesselation ~fckit ~fftw ~eigen
  - proj@=9.7.0 ~tiff ~curl
  - py-pyproj@=3.7.2
  variants:
  - ~mpi
  views:
    base:
      link: roots
      uenv:
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]
        env_vars:
          set:
            - FDB_HOME:          "$@view_path@"
            - FDB5_HOME:         "$@view_path@"
            - ECKIT_HOME:        "$@view_path@"
            - FINDLIBS_DISABLE_PACKAGE: "yes"
            - GRIB_DEFINITION_PATH: "$@mount@/data/share/eccodes-cosmo-mars/definitions:\
                                     $@mount@/venvs/fdb/share/eccodes-cosmo-resources/definitions:\
                                     $@mount@/env/fdb/share/eccodes/definitions"
            - FDB_ENABLE_GRIBJUMP: "1"
            - AUTO_LOAD_PLUGINS:   "1"
            - FILEHANDLE_IO_BUFFERSIZE: "1"
            - ECCODES_ECKIT_GEO:   "1"
            - ECCODES_VERSION_CHECK_OFF: "1"
            - PYTHONUSERBASE: "$@mount@/venvs/fdb"
          prepend_path:
            - PATH: "$@mount@/venvs/fdb/bin/"
            - PYTHONPATH: "$@view_path@/lib/python3.11/site-packages"
    realtime:
      link: roots
      uenv:
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]
        env_vars:
          set:
            - FDB_HOME:          "$@view_path@"
            - FDB5_HOME:         "$@view_path@"
            - ECKIT_HOME:        "$@view_path@"
            - FINDLIBS_DISABLE_PACKAGE: "yes"
            - GRIB_DEFINITION_PATH: "$@mount@/data/share/eccodes-cosmo-mars/definitions:\
                                     $@mount@/venvs/fdb/share/eccodes-cosmo-resources/definitions:\
                                     $@mount@/env/fdb/share/eccodes/definitions"
            # NOTE: this assumes that the fdb config names match the view names
            - FDB_CONFIG_FILE:  "$@mount@/meta/recipe/meta/private/fdb_config/$@view_name@.yaml"
            - FDB_ENABLE_GRIBJUMP: "1"
            - AUTO_LOAD_PLUGINS:   "1"
            - FILEHANDLE_IO_BUFFERSIZE: "1"
            - ECCODES_ECKIT_GEO:   "1"
            - ECCODES_VERSION_CHECK_OFF: "1"
            - PYTHONUSERBASE: "$@mount@/venvs/fdb"
          prepend_path:
            - PATH: "$@mount@/venvs/fdb/bin/"
