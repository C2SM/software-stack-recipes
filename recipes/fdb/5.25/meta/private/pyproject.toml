[tool.poetry]
name = "nwp-demo"
version = "1.0"
description = "Demo scripts and notebooks for reading and processing forecast data using Polytope."
authors = ["MeteoSwiss"]
package-mode = false

[[tool.poetry.source]]
name = "pypi-mch"
url = "https://service.meteoswiss.ch/nexus/repository/python-all/simple"
priority = "primary"

[[tool.poetry.source]]
name = "pypi"
priority = "supplemental"

[tool.poetry.dependencies]
python = "~3.11"
pyfdb = "5.25.0.33"
fdb-utils = { git = "https://github.com/MeteoSwiss/fdb-utils.git", tag = "1.5.9"}
ipykernel = "*"
polytope-client = "^0.7.10"
nbconvert = "*"
nbformat = "*"
pyyaml = "*"
pytest = "*"

# We need kaleido <1.x to avoid google chrome for chart.show("png")
# plotly 7.x requires kaleido >= 1.x
kaleido = "0.2.1"
plotly = "^6.9.0"

# Earthkit 1.0
earthkit-utils = "~1.0.3"
earthkit-data = {version = "~1.3.0", extras = ["all"]}
earthkit-geo = {version = "~1.2.0", extras = ["all"]}
earthkit-meteo = {version = "~1.2.1", extras = ["all"]}
earthkit-transforms = {version = "~1.0.0", extras = ["all"]}
earthkit-hydro = "~1.4.0"
earthkit-plots = "~1.0.4"

# MCH internal pypi (until officially published by DWD)
eccodes-cosmo-resources-python-internal = {version = "^2.47.0.1", source = "pypi-mch"}

eckit = "~2.5.0.33"
eckitlib = "~2.5.0.33"
mir-python = "~1.30.2.33"
mirlib = "~1.30.2.33"
eccodes = "~2.50.0"
eccodeslib =  "~2.50.0.33"
covjsonkit = "^0.2.26"


[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = "."

[tool.yapf]
based_on_style = "pep8"
column_limit = "120"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
