eobs-lab:
  compiler: [gcc]
  specs:
    - python@3.12
  unify: true
  views:
    # Deliberately not named `default`: config.yaml's `default-view` is what
    # makes a view the default one, and giving a view that name as well is
    # advised against. The JupyterHub spawn form wants a view typed into it
    # either way, so type `lab` there.
    lab:
      link: roots
      uenv:
        add_compilers: false
        env_vars:
          set:
            # Read by narthex_launcher when it stamps a launched notebook.
            # Baked in at build time, so a new backend URL means a rebuild.
            - NARTHEX_API_URL: "https://narthex-prometheus-dev.c2sm-tds.c2sm.cscs.ch/api"
            # Where that server finds the two config files post-install
            # writes: the JSON that enables the narthex-launch extension, and
            # the .py that points it at the template venvs' labextensions so
            # ipywidgets renders rather than printing its repr.
            #
            # Set, not prepended: stackinator only appends to a fixed list of
            # prefix variables (PATH, PYTHONPATH, ... -- see list_variables
            # in stackinator/etc/envvars.py) and this is not one of them, so
            # it is handled as a plain scalar. Nothing on Alps sets it, so
            # there is nothing to lose by overwriting -- jupyter still reads
            # ~/.jupyter and the server's own etc/jupyter besides it.
            - JUPYTER_CONFIG_PATH: "$@mount@/jupyter/etc/jupyter"
            # Where that server finds the image's kernels, narthex-<key>, one
            # per template venv under $@mount@/venvs (see post-install). Set,
            # not prepended, for the same reason as JUPYTER_CONFIG_PATH.
            # Entries here come before the user's own data dir, so an image
            # kernel's name always resolves here.
            - JUPYTER_PATH: "$@mount@/jupyter/share/jupyter"
          prepend_path:
            # narthex's create-venv.sh needs uv on PATH
            - PATH: "$@mount@/uv"
            # How the narthex-launch endpoint gets into the notebook server.
            # On jupyter-santis that server is the Hub's own jupyterlab uenv
            # (/user-tools), not anything in this image, so the extension
            # cannot be enabled through a prefix install -- this path and
            # JUPYTER_CONFIG_PATH above are what that server does read. uenv
            # has no load-time hook to run anything instead; a view only sets
            # environment variables.
            #
            # $@mount@/jupyter/py holds narthex_launcher.py and its notebook
            # templates (see post-install), kept apart from any venv's
            # site-packages because the Hub's server runs a different Python.
            - PYTHONPATH: "$@mount@/jupyter/py"
